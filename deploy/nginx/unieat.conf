# Nginx配置文件 for UniEat
# 放置位置: /etc/nginx/sites-available/unieat
# 创建软链接: sudo ln -s /etc/nginx/sites-available/unieat /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name unieat.top www.unieat.top;
    
    # 重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name unieat.top www.unieat.top;
    
    # SSL证书配置 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/unieat.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unieat.top/privkey.pem;
    
    # SSL配置优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # 客户端最大请求体大小
    client_max_body_size 20M;
    
    # 静态文件配置
    location /static/ {
        alias /path/to/your/unieat/project/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # 媒体文件配置
    location /media/ {
        alias /path/to/your/unieat/project/media/;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # API请求转发到Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # 日志配置
    access_log /var/log/nginx/unieat_access.log;
    error_log /var/log/nginx/unieat_error.log;
}
